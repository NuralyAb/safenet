<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0c10" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>SafeNet KZ — цифровой щит</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply theme before first paint to avoid a flash. Dark is the default
      // (Intelligence Terminal); light only applies on an explicit saved choice.
      (function () {
        var t = "dark";
        try {
          var saved = localStorage.getItem("afm-theme");
          if (saved === "light" || saved === "dark") t = saved;
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
